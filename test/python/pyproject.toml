# Its own uv project rather than part of the root pyproject.toml: the root one
# is tooling, and keeping this directory's files shaped like upstream's
# test/python (Recidiviz/bigquery-emulator) keeps a re-sync a plain diff.
[project]
name = "zigquery-integration-tests"
version = "0.1.0"
description = "Python client integration tests for the zigquery emulator"
readme = "README.md"
requires-python = ">=3.11.11"
dependencies = [
    "attrs>=25.4.0",
    "docker>=7.1.0",
    "fastavro>=1.12.1",
    "google-cloud-bigquery>=3.38.0",
    "google-cloud-bigquery-storage>=2.34.0",
    "more-itertools>=10.8.0",
    "pandas>=2.3.3",
    "pandas-gbq>=0.31.0",
    "pyarrow>=22.0.0",
    "pytest>=9.0.1",
    "pytest-xdist>=3.8.0",
    "pytz>=2025.2",
    "testcontainers>=4.0.0",
]

[tool.uv]
package = false
