name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. v0.1.0). Nothing is published.
        required: true

permissions:
  contents: write
  packages: write

env:
  ZIG_VERSION: "0.17.0-dev.2131+d08989840"
  REGISTRY: ghcr.io

jobs:
  version:
    name: resolve version
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            publish=false
          else
            version="${{ github.ref_name }}"
            publish=true
          fi
          # The tag is the source of truth, but build.zig.zon carries a version
          # too and a mismatch means the shipped binary reports the wrong one.
          zon=$(sed -n 's/^[[:space:]]*\.version = "\(.*\)",$/\1/p' build.zig.zon | head -1)
          if [ "v$zon" != "$version" ]; then
            echo "::error::tag $version does not match build.zig.zon version $zon"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  # Builds into the cache only; everything after restores. Serialized per
  # cache key with CI, so a tag cut while CI is building the same shim waits
  # for it rather than starting a second cold build.
  shim-build:
    name: shim build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: runs-on=${{ github.run_id }}/runner=shim-x64/extras=s3-cache
            runs_on_agent: true
          - platform: linux-arm64
            runner: runs-on=${{ github.run_id }}/runner=shim-arm64/extras=s3-cache
            runs_on_agent: true
          # RunsOn is Linux/Windows on EC2, so darwin builds on GitHub-hosted
          # *larger runners*: zigquery-mac-build for arm64 and
          # zigquery-mac-build-x64 for x64. Both are matched by name
          # alone — pairing either with the `self-hosted` label would mean the
          # job never schedules, since that label exists only on genuinely
          # self-hosted runners.
          #
          # Keeping a real x64 runner rather than cross-compiling means the
          # tarball is built and smoke-tested on the architecture it targets.
          - platform: darwin-arm64
            runner: zigquery-mac-build
            runs_on_agent: false
          - platform: darwin-x64
            runner: zigquery-mac-build-x64
            runs_on_agent: false
    uses: ./.github/workflows/shim.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      runs_on_agent: ${{ matrix.runs_on_agent }}

  shim:
    name: shim (${{ matrix.platform }})
    needs: [version, shim-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
            runs_on_agent: true
          - platform: linux-arm64
            runner: runs-on=${{ github.run_id }}/runner=zig-arm64/extras=s3-cache
            runs_on_agent: true
          # Same mac runners as shim-build: darwin restores from GitHub's
          # cache, which a RunsOn runner (S3-backed) cannot see.
          - platform: darwin-arm64
            runner: zigquery-mac-build
            runs_on_agent: false
          - platform: darwin-x64
            runner: zigquery-mac-build-x64
            runs_on_agent: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
        if: matrix.runs_on_agent
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: ${{ matrix.platform }}

      # The dylib is a *developer* build input (-Dshim-dylib), not part of the
      # product: the shipped binaries link the static object instead, and the
      # tarball smoke test below asserts no lib/ is present. Publishing it
      # means a contributor can run `zig build test`/`spec` without bazel and
      # without the 82 MB googlesql submodule.
      #
      # SHIM_KEY is the shim action's content-addressed key: a hash of the
      # submodule pointer, analyzer_shim.cc, shim.lds, shim/BUILD.bazel,
      # MODULE.bazel{,.lock}, .bazelrc and .bazelversion. The shim's ABI
      # tracks those inputs, not the release tag, so a downloaded dylib whose
      # key differs from the checkout's is a mismatch and has to be rebuilt —
      # that failure surfaces as a bus error at the first FFI call, not as a
      # link error, so the key is the only cheap way to catch it.
      - name: package
        id: pkg
        run: |
          set -euo pipefail
          name="googlesql-shim-${{ needs.version.outputs.version }}-${{ matrix.platform }}"
          stage=$(mktemp -d)
          cp "${{ steps.shim.outputs.path }}" "$stage/"
          echo "${{ steps.shim.outputs.key }}" > "$stage/SHIM_KEY"

          # googlesql, ICU, RE2, abseil, protobuf and the rest are linked into
          # the shim, and their licenses require the notices to travel with
          # it. THIRD_PARTY_NOTICES covers every component of the binaries,
          # the shim's included. A plain cp, so a missing file fails the job.
          cp LICENSE NOTICE THIRD_PARTY_NOTICES "$stage/"

          tar -C "$stage" -czf "$name.tar.gz" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shim-dist-${{ matrix.platform }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
          retention-days: 7

  binaries:
    name: binaries (${{ matrix.platform }})
    needs: [version, shim]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
            runs_on_agent: true
          - platform: linux-arm64
            runner: runs-on=${{ github.run_id }}/runner=zig-arm64/extras=s3-cache
            runs_on_agent: true
          - platform: darwin-arm64
            runner: zigquery-mac-build
            runs_on_agent: false
          - platform: darwin-x64
            runner: zigquery-mac-build-x64
            runs_on_agent: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
        if: matrix.runs_on_agent
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: ${{ matrix.platform }}
      - uses: ./.github/actions/zig
        with:
          version: ${{ env.ZIG_VERSION }}

      # `dist` installs only the two products, statically linked against the
      # shim, which is exactly the shipped tree — `install` would drag in
      # eight harness and benchmark binaries.
      #
      # -Dcpu=baseline is what makes the artifact redistributable. Zig's
      # default target is `native`, which bakes in the *builder's*
      # microarchitecture: the arm64 runner is Graviton (Neoverse, has SVE),
      # so the released binary carried SVE and died with SIGILL on any CPU
      # without it — Apple Silicon among them. Baseline keeps the native
      # OS/arch/ABI, and so the glibc linkage, while restricting the
      # instruction set to what every CPU of that architecture implements.
      #
      # The C++ shim needs no equivalent: bazel's -c opt already compiles for
      # the generic baseline rather than the host.
      - name: zig build dist
        run: |
          zig build dist -Drelease=true -Dcpu=baseline \
            -Dshim-dylib=${{ steps.shim.outputs.path }} \
            -Dshim-static-obj=${{ steps.shim.outputs.static-path }} \
            --prefix "$PWD/stage"

      - name: package
        id: pkg
        run: |
          set -euo pipefail
          # Named for the product and the repo (Recidiviz/zigquery).
          name="zigquery-${{ needs.version.outputs.version }}-${{ matrix.platform }}"
          # A plain cp, so a missing license file fails the release rather
          # than shipping binaries without the notices their dependencies'
          # licenses require.
          cp README.md LICENSE NOTICE THIRD_PARTY_NOTICES stage/
          tar -C stage -czf "$name.tar.gz" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The shim is statically linked, so the tarball should need nothing
      # beyond bin/ — prove it by running from a directory that has no
      # relationship to the checkout and asserting no lib/ was even shipped.
      - name: smoke test the tarball
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          tar -C "$work" -xzf "${{ steps.pkg.outputs.name }}.tar.gz"
          cd "$work"
          [ ! -d lib ]
          echo "no lib/ shipped, as expected for a statically-linked build"
          echo "--- CLI ---"
          ./bin/zigquery-cli "SELECT 1 AS n, 'ok' AS s"
          echo "--- server ---"
          # --flag=value only; the parser rejects the space-separated form.
          ./bin/zigquery-server --project=smoke > server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            grep -q "REST server listening" server.log && break
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          # Byte-exact: node/python testcontainer fixtures gate readiness on
          # this line, so a change to it silently breaks downstream users.
          grep -q "\[bigquery-emulator\] REST server listening at 0.0.0.0:9050" server.log
          echo "banner OK"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.platform }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
          retention-days: 7

  docker:
    name: image (${{ matrix.platform }})
    needs: [version, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            docker_platform: linux/amd64
            runner: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
          - platform: linux-arm64
            docker_platform: linux/arm64
            runner: runs-on=${{ github.run_id }}/runner=zig-arm64/extras=s3-cache
    runs-on: ${{ matrix.runner }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-${{ matrix.platform }}

      # The Dockerfile only COPYs, so each arch is built natively on its own
      # runner and no QEMU is involved.
      - name: unpack into the build context
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C dist -xzf zigquery-*.tar.gz
          # The license files stay: the Dockerfile copies them into the image.
          rm -f dist/README.md
          find dist -type f

      - id: meta
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest so the two arches can be merged into one manifest
      # below. workflow_dispatch builds the image but exports nothing, which
      # keeps the dry run honest without publishing a tag.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.docker_platform }}
          provenance: false
          outputs: >-
            ${{ needs.version.outputs.publish == 'true'
                && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.meta.outputs.image)
                || 'type=cacheonly' }}

      - name: export digest
        if: needs.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.publish == 'true'
        with:
          name: digest-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: multi-arch manifest
    needs: [version, docker]
    if: needs.version.outputs.publish == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create and push manifest
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          version="${{ needs.version.outputs.version }}"
          semver="${version#v}"
          minor="${semver%.*}"
          refs=""
          for d in /tmp/digests/*; do refs="$refs ${image}@sha256:$(basename "$d")"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t "${image}:${version}" \
            -t "${image}:${minor}" \
            -t "${image}:latest" \
            $refs
          docker buildx imagetools inspect "${image}:${version}"

  release:
    name: github release
    needs: [version, shim, binaries, manifest]
    if: needs.version.outputs.publish == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      # A separate pattern, because `dist-*` is a prefix glob and would not
      # match these. Same directory on purpose: the shim tarball then lands in
      # SHA256SUMS and in `files: artifacts/*.tar.gz` below with no further
      # changes.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shim-dist-*
          path: artifacts
          merge-multiple: true
      - run: |
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          ls -l
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
