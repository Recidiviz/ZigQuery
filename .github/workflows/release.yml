name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. v0.1.0). Nothing is published.
        required: true

permissions:
  contents: write
  packages: write

env:
  ZIG_VERSION: "0.16.0"
  REGISTRY: ghcr.io

jobs:
  version:
    name: resolve version
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            publish=false
          else
            version="${{ github.ref_name }}"
            publish=true
          fi
          # The tag is the source of truth, but build.zig.zon carries a version
          # too and a mismatch means the shipped binary reports the wrong one.
          zon=$(sed -n 's/^[[:space:]]*\.version = "\(.*\)",$/\1/p' build.zig.zon | head -1)
          if [ "v$zon" != "$version" ]; then
            echo "::error::tag $version does not match build.zig.zon version $zon"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  shim:
    name: shim (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: runs-on=${{ github.run_id }}/runner=shim-x64/extras=s3-cache
            runs_on_agent: true
          - platform: linux-arm64
            runner: runs-on=${{ github.run_id }}/runner=shim-arm64/extras=s3-cache
            runs_on_agent: true
          # RunsOn is Linux/Windows on EC2, so darwin is built elsewhere:
          # arm64 on the self-hosted zigquery-emulator-mac-build box, and x64
          # on GitHub-hosted macos-15-intel so it stays a native build rather
          # than a cross-compile. macos-15-intel is the last Intel image (x64
          # macOS support ends Fall 2027); macos-14 is already mid-deprecation
          # and is deliberately not used.
          - platform: darwin-arm64
            runner: [self-hosted, zigquery-emulator-mac-build]
            runs_on_agent: false
          - platform: darwin-x64
            runner: macos-15-intel
            runs_on_agent: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: runs-on/action@v2
        if: matrix.runs_on_agent
      - uses: actions/checkout@v4
      - uses: ./.github/actions/shim
        with:
          platform: ${{ matrix.platform }}

  binaries:
    name: binaries (${{ matrix.platform }})
    needs: [version, shim]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
            runs_on_agent: true
          - platform: linux-arm64
            runner: runs-on=${{ github.run_id }}/runner=zig-arm64/extras=s3-cache
            runs_on_agent: true
          - platform: darwin-arm64
            runner: [self-hosted, zigquery-emulator-mac-build]
            runs_on_agent: false
          - platform: darwin-x64
            runner: macos-15-intel
            runs_on_agent: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: runs-on/action@v2
        if: matrix.runs_on_agent
      - uses: actions/checkout@v4
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: ${{ matrix.platform }}
      - uses: ./.github/actions/zig
        with:
          version: ${{ env.ZIG_VERSION }}

      # `dist` installs only the two products plus the shim into lib/, which
      # is exactly the shipped tree — `install` would drag in eight harness
      # and benchmark binaries.
      - name: zig build dist
        run: |
          zig build dist -Drelease=true \
            -Dshim-dylib=${{ steps.shim.outputs.path }} \
            --prefix "$PWD/stage"

      - name: package
        id: pkg
        run: |
          set -euo pipefail
          # Named for the product and the repo (Recidiviz/zigquery-emulator),
          # not for the zon package name, which is still zetasqlite_zig.
          name="zigquery-emulator-${{ needs.version.outputs.version }}-${{ matrix.platform }}"
          cp README.md stage/
          [ -f LICENSE ] && cp LICENSE stage/ || true
          tar -C stage -czf "$name.tar.gz" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The point of this step is the rpath. A binary that only resolves the
      # shim through the absolute bazel-bin entry works perfectly in the build
      # tree and fails the moment a user unpacks it, so prove it here by
      # running from a directory that has no relationship to the checkout.
      - name: smoke test the tarball
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          tar -C "$work" -xzf "${{ steps.pkg.outputs.name }}.tar.gz"
          cd "$work"
          echo "--- CLI ---"
          ./bin/zetasqlite-zig "SELECT 1 AS n, 'ok' AS s"
          echo "--- server ---"
          # --flag=value only; the parser rejects the space-separated form.
          ./bin/bigquery-emulator --project=smoke > server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            grep -q "REST server listening" server.log && break
            sleep 0.5
          done
          kill "$pid" 2>/dev/null || true
          # Byte-exact: node/python testcontainer fixtures gate readiness on
          # this line, so a change to it silently breaks downstream users.
          grep -q "\[bigquery-emulator\] REST server listening at 0.0.0.0:9050" server.log
          echo "banner OK"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
          retention-days: 7

  docker:
    name: image (${{ matrix.platform }})
    needs: [version, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            docker_platform: linux/amd64
            runner: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
          - platform: linux-arm64
            docker_platform: linux/arm64
            runner: runs-on=${{ github.run_id }}/runner=zig-arm64/extras=s3-cache
    runs-on: ${{ matrix.runner }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.platform }}

      # The Dockerfile only COPYs, so each arch is built natively on its own
      # runner and no QEMU is involved.
      - name: unpack into the build context
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C dist -xzf zigquery-emulator-*.tar.gz
          rm -f dist/README.md dist/LICENSE
          find dist -type f

      - id: meta
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest so the two arches can be merged into one manifest
      # below. workflow_dispatch builds the image but exports nothing, which
      # keeps the dry run honest without publishing a tag.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.docker_platform }}
          provenance: false
          outputs: >-
            ${{ needs.version.outputs.publish == 'true'
                && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.meta.outputs.image)
                || 'type=cacheonly' }}

      - name: export digest
        if: needs.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.publish == 'true'
        with:
          name: digest-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: multi-arch manifest
    needs: [version, docker]
    if: needs.version.outputs.publish == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create and push manifest
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          version="${{ needs.version.outputs.version }}"
          semver="${version#v}"
          minor="${semver%.*}"
          refs=""
          for d in /tmp/digests/*; do refs="$refs ${image}@sha256:$(basename "$d")"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t "${image}:${version}" \
            -t "${image}:${minor}" \
            -t "${image}:latest" \
            $refs
          docker buildx imagetools inspect "${image}:${version}"

  release:
    name: github release
    needs: [version, binaries, manifest]
    if: needs.version.outputs.publish == 'true'
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts
          merge-multiple: true
      - run: |
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
