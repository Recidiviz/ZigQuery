name: CI

on:
  pull_request:
  push:
    # server-port is transitional: it carries all current work and master is
    # ~73 commits behind it. Drop it from this list once it has been merged
    # and the default branch is settled.
    branches: [master, main, server-port]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0-dev.2131+d08989840"

jobs:
  # Populates the shim cache once per run so the jobs below can never race
  # into N simultaneous cold bazel builds. On a hit this is ~20s; the big
  # runner only earns its keep on the miss path.
  shim:
    name: shim (linux-x64)
    runs-on: runs-on=${{ github.run_id }}/runner=shim-x64/extras=s3-cache
    outputs:
      path: ${{ steps.shim.outputs.path }}
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: linux-x64

  # No shim: the ephor artifact is a standalone executable that never links
  # the engine module, and build.zig only treats the shim path as a string at
  # configure time.
  analysis:
    name: ephor + fmt
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: ./.github/actions/zig
        with:
          version: ${{ env.ZIG_VERSION }}

      # ephor's ZA601 already runs `zig fmt --check` over src/; these are the
      # trees its path_dir does not reach, less the ephor sources and cache that
      # tools/ephor fetches.
      - name: zig fmt
        run: >-
          zig fmt --check build.zig entrypoints tools
          --exclude tools/ephor/zig-pkg --exclude tools/ephor/.zig-cache

      # ephor builds with the Zig that tools/ephor/build.zig.zon names, not this
      # project's, so its package runs directly rather than through `zig build ephor`.
      - uses: ./.github/actions/zig
        with:
          version: "0.16.0"

      - name: ephor
        run: zig build --build-file tools/ephor/build.zig run -- --summary --fail-on=note

  test:
    name: unit tests
    needs: shim
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: linux-x64
      - uses: ./.github/actions/zig
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test -Dshim-dylib=${{ steps.shim.outputs.path }}
      - run: zig build test-server -Dshim-dylib=${{ steps.shim.outputs.path }}

  spec:
    name: spec (googlesqlite + go-zetasqlite)
    needs: shim
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: linux-x64
      - uses: ./.github/actions/zig
        with:
          version: ${{ env.ZIG_VERSION }}

      # --strict is what makes this a real gate: without it the runner exits
      # nonzero only on a baseline regression, so a case that has never passed
      # can start returning wrong answers and still go green.
      - name: zig build spec --strict
        run: |
          set -euo pipefail
          zig build spec -Drelease=true \
            -Dshim-dylib=${{ steps.shim.outputs.path }} -- --strict | tee spec.log

      # Reuses the run above rather than invoking --markdown, which would
      # replay all cases a second time for a per-category table.
      - name: summary
        if: always()
        run: |
          { echo '## Spec'; echo; echo '```'; head -20 spec.log; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  # Not benchmarks: every harness here carries a positive control (GENERATE_UUID
  # uniqueness; per-connection catalogs that MUST fail; a gRPC status that must
  # come from our handler rather than the transport) and exits nonzero when the
  # control does not behave, so a broken build cannot quietly pass them.
  concurrency-harness:
    name: concurrency harnesses
    needs: shim
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: linux-x64
      - uses: ./.github/actions/zig
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build analyzer-threads -Drelease=true -Dshim-dylib=${{ steps.shim.outputs.path }}
      - run: zig build shared-catalog-threads -Drelease=true -Dshim-dylib=${{ steps.shim.outputs.path }}
      # Same contract: the Storage Read transport answers UNIMPLEMENTED, and
      # three controls (an unknown service must reach our handler too, a second
      # call on one channel must be answered, and the listener must be gone
      # after stop()) mean a build that merely links cannot pass. It binds port
      # 0, so it cannot collide with anything else on the runner.
      - run: zig build grpc-smoke -Drelease=true -Dshim-dylib=${{ steps.shim.outputs.path }}

  # Both generated codecs come from committed .fdsets and are easy to forget
  # when one of them moves. gen-proto is a host tool that does not link the
  # engine, so no shim.
  gen-proto-drift:
    name: gen-proto drift
    runs-on: runs-on=${{ github.run_id }}/runner=zig-x64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - uses: ./.github/actions/zig
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build gen-proto
      - name: check for drift
        run: |
          for f in src/proto/resolved_ast.zig src/server/proto/storage.zig; do
            if ! git diff --exit-code -- "$f"; then
              echo "::error::$f is stale — run 'zig build gen-proto'"
              exit 1
            fi
          done

  # Cross-arch breakage is cheap to catch here and expensive to discover at
  # tag time. Push-only: it needs its own arm64 shim, which is a second cold
  # bazel build the first time the submodule moves.
  build-arm64:
    name: build (linux-arm64)
    if: github.event_name == 'push'
    runs-on: runs-on=${{ github.run_id }}/runner=shim-arm64/extras=s3-cache
    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v4
      - id: shim
        uses: ./.github/actions/shim
        with:
          platform: linux-arm64
      - uses: ./.github/actions/zig
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: >-
          zig build dist -Drelease=true
          -Dshim-dylib=${{ steps.shim.outputs.path }}
          -Dshim-static-obj=${{ steps.shim.outputs.static-path }}
