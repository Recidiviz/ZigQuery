name: googlesql shim
description: >
  Restore the googlesql shim's two build outputs for the current platform from cache:
  the dynamic library (for -Dshim-dylib, the dev/test/harness path) and the
  statically-linkable relocatable object (for -Dshim-static-obj).
  Never builds: the calling job must `needs:` a job that runs .github/workflows/shim.yml

inputs:
  platform:
    description: linux-x64 | linux-arm64 | darwin-arm64 | darwin-x64
    required: true

outputs:
  path:
    description: Repo-root-relative path to the shim dylib, for -Dshim-dylib
    value: ${{ steps.vars.outputs.path }}
  static-path:
    description: Repo-root-relative path to the static object, for -Dshim-static-obj
    value: ${{ steps.vars.outputs.static-path }}
  key:
    description: The content-addressed cache key that was used
    value: ${{ steps.vars.outputs.key }}

runs:
  using: composite
  steps:
    - id: vars
      shell: bash
      run: '"$GITHUB_ACTION_PATH/../../scripts/shim-vars.sh" "${{ inputs.platform }}"'

    - uses: actions/cache/restore@v4
      with:
        path: dist/shim
        key: ${{ steps.vars.outputs.key }}
        fail-on-cache-miss: true

    - shell: bash
      run: |
        set -euo pipefail
        ls -l "${{ steps.vars.outputs.path }}" "${{ steps.vars.outputs.static-path }}"
        echo "shim: ${{ steps.vars.outputs.path }}, ${{ steps.vars.outputs.static-path }}" >> "$GITHUB_STEP_SUMMARY"
